[project]
name = "travel_planner"
default-app = "web"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.planner]
kind = "service"
entry-point = "core.server"

[dependencies.npm]
react-native-web = "^0.21.2"

# Plain logic modules run as normal server code (never compiled to native).
[placement]
default = "server"

# The form endpoints take one plain parameter per form field on purpose.
[check.lint]
ignore = ["too-many-params"]

# `jac test` runs the tests for the shared planning logic.
[test]
directories = ["core"]
